<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр вопросов — данные вшиты</title>
<style>
:root {
  --bg:#eef2ff; --card:#fff; --text:#111827; --muted:#64748b; --line:#dbe4f0;
  --blue:#2563eb; --blue2:#1d4ed8; --green:#dcfce7; --greenB:#22c55e; --greenT:#166534;
  --red:#fee2e2; --redB:#ef4444; --redT:#991b1b;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  font-family:Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
}
.header {
  background:linear-gradient(135deg,#1d4ed8,#7c3aed);
  color:#fff;
  padding:20px 12px 42px;
  text-align:center;
}
.header h1 { margin:0 0 8px; font-size:28px; }
.header p { margin:0 auto; max-width:900px; font-size:15px; opacity:.95; }
.wrap { max-width:1100px; margin:0 auto; padding:0 10px 40px; }
.panel {
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin-top:-28px;
  box-shadow:0 10px 30px rgba(15,23,42,.12);
}
.modes,.controls { display:flex; flex-wrap:wrap; gap:8px; }
.controls { margin-top:10px; }
.btn {
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  font-weight:800;
  cursor:pointer;
  font-size:15px;
}
.btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
.btn.secondary { background:#eef2ff; border-color:#c7d2fe; color:#312e81; }
.btn.warn { background:#fff7ed; border-color:#fdba74; }
.btn.danger { background:#fff1f2; border-color:#fda4af; }
.search {
  flex:1;
  min-width:220px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  font-size:15px;
}
.stats {
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-top:12px;
}
.stat {
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px;
  text-align:center;
  background:#f8fafc;
}
.stat b { display:block; font-size:20px; }
.stat span { font-size:13px; }
.progress { height:9px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-top:10px; }
.progress div { height:100%; width:0; background:linear-gradient(90deg,#22c55e,#2563eb); }
.hint { font-size:14px; color:var(--muted); margin-top:10px; }
.tools { display:none; border-top:1px dashed var(--line); margin-top:12px; padding-top:12px; }
.tools.show { display:block; }
textarea {
  display:none;
  width:100%;
  min-height:90px;
  margin-top:8px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}
.card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 5px 16px rgba(15,23,42,.06);
}
.meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.tag {
  font-size:12px;
  font-weight:800;
  background:#eef2ff;
  color:#3730a3;
  border:1px solid #c7d2fe;
  border-radius:999px;
  padding:3px 8px;
}
.tag.source { background:#ecfeff; color:#155e75; border-color:#a5f3fc; }
.q { font-size:18px; font-weight:900; line-height:1.35; margin:7px 0 12px; }
.options { display:grid; gap:8px; }
.opt {
  width:100%;
  text-align:left;
  border:1px solid var(--line);
  background:#f8fafc;
  border-radius:12px;
  padding:12px;
  font-size:15.5px;
  line-height:1.35;
  cursor:pointer;
}
.opt.correct { background:var(--green); border-color:var(--greenB); color:var(--greenT); font-weight:900; }
.opt.wrong { background:var(--red); border-color:var(--redB); color:var(--redT); font-weight:900; }
.answer {
  display:none;
  margin-top:10px;
  border:1px solid var(--greenB);
  background:var(--green);
  color:var(--greenT);
  border-radius:12px;
  padding:11px;
  font-weight:900;
}
.answer.show { display:block; }
.empty {
  background:#fef9c3;
  border:1px solid #fde047;
  border-radius:14px;
  padding:14px;
  margin:12px 0;
}
.mobileNav { display:none; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }

@media(max-width:760px) {
  .header { padding:14px 10px 32px; }
  .header h1 { font-size:22px; }
  .header p { font-size:13px; line-height:1.35; }
  .wrap { padding:0 6px 30px; }
  .panel { padding:9px; border-radius:15px; margin-top:-24px; }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .btn { font-size:14px; padding:11px 8px; }
  .controls { display:grid; grid-template-columns:1fr; gap:7px; }
  .search { min-width:0; width:100%; font-size:15px; }
  .stats { grid-template-columns:repeat(3,1fr); gap:6px; }
  .stat { padding:7px 3px; }
  .stat b { font-size:17px; }
  .stat span { display:block; font-size:11px; line-height:1.15; }
  .hint { font-size:12.5px; }
  .card { padding:11px; border-radius:14px; margin:9px 0; }
  .tag { font-size:10.5px; padding:2px 6px; }
  .q { font-size:16px; margin:6px 0 10px; }
  .opt { font-size:14.5px; padding:12px 10px; }
  .answer { font-size:14px; padding:10px; }
  .mobileNav { display:grid; }
}
@media(max-width:420px) {
  .modes { grid-template-columns:1fr; }
  .stats { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>

<div class="header">
  <h1>Умный тренажёр вопросов</h1>
  <p>Данные вшиты прямо в этот HTML-файл. Нажми на ответ: правильный станет зелёным, неверный выбранный — красным.</p>
</div>

<div class="wrap">
  <div class="panel">
    <div class="modes">
      <button class="btn primary" data-mode="random20">🎲 20 случайных</button>
      <button class="btn primary" data-mode="smart20">🧠 Умный режим 20</button>
      <button class="btn primary" data-mode="mistakes20">❌ 20 из ошибок</button>
      <button class="btn primary" data-mode="hardest20">🔥 Проблемные 20</button>
      <button class="btn primary" data-mode="all">📚 Все вопросы</button>
      <button class="btn secondary" data-mode="new87">🆕 Только 87 новых</button>
      <button class="btn secondary" data-mode="old">📘 Только старые</button>
      <button class="btn" id="shuffleBtn">🔀 Перемешать</button>
    </div>

    <div class="controls">
      <input id="search" class="search" placeholder="Поиск по вопросу, теме или ответам...">
      <button class="btn warn" id="retrySessionBtn">Повторить ошибки сессии</button>
      <button class="btn danger" id="resetBtn">Сбросить статистику</button>
      <button class="btn" id="toolsBtn">⚙️ Экспорт / импорт</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="totalCount">0</b><span>в базе</span></div>
      <div class="stat"><b id="shownCount">0</b><span>показано</span></div>
      <div class="stat"><b id="answeredCount">0</b><span>отвечено</span></div>
      <div class="stat"><b id="correctCount">0</b><span>верно</span></div>
      <div class="stat"><b id="wrongCount">0</b><span>ошибок</span></div>
      <div class="stat"><b id="savedMistakes">0</b><span>сохранено</span></div>
    </div>

    <div class="progress"><div id="progress"></div></div>
    <div class="hint" id="hint">Загрузка вопросов...</div>

    <div class="tools" id="tools">
      <button class="btn" id="exportBtn">Экспорт статистики</button>
      <button class="btn" id="importBtn">Импорт статистики</button>
      <button class="btn" id="hideToolsBtn">Скрыть</button>
      <textarea id="statsBox" placeholder="Здесь появится JSON статистики или вставь свой для импорта"></textarea>
    </div>

    <div class="mobileNav">
      <button class="btn" id="nextBtn">Следующий</button>
      <button class="btn" id="topBtn">Наверх</button>
    </div>
  </div>

  <main id="quiz"></main>
</div>

<script>
(function () {
  "use strict";

  var QUESTIONS = [];
  var STORAGE_KEY = "quiz_stats_embedded_safe_v1";
  var stats = {};
  var current = [];
  var session = { answered: 0, correct: 0, wrong: 0, wrongIds: {}, answeredIds: {} };

  function byId(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function safeId(s) {
    return String(s).replace(/[^a-zA-Z0-9_-]/g, "_");
  }

  function loadQuestions() {
    try {
      var raw = byId("questions-data").textContent || "[]";
      QUESTIONS = JSON.parse(raw);
    } catch (e) {
      QUESTIONS = [];
      byId("quiz").innerHTML = '<div class="empty">Ошибка: вопросы не прочитались из HTML. Попробуй открыть файл в Chrome/Safari, не в предпросмотре.</div>';
    }
  }

  function loadStats() {
    try {
      stats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch (e) {
      stats = {};
    }
  }

  function saveStats() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
    } catch (e) {}
    updateStats();
  }

  function statFor(id) {
    if (!stats[id]) stats[id] = { seen: 0, correct: 0, wrong: 0, lastWrong: false };
    return stats[id];
  }

  function resetSession() {
    session = { answered: 0, correct: 0, wrong: 0, wrongIds: {}, answeredIds: {} };
    var search = byId("search");
    if (search) search.value = "";
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sample(arr, n) {
    return shuffle(arr).slice(0, Math.min(n, arr.length));
  }

  function oldQuestions() {
    return QUESTIONS.filter(function (q) { return q.source === "old"; });
  }

  function newQuestions() {
    return QUESTIONS.filter(function (q) { return q.source === "new"; });
  }

  function mistakes(pool) {
    pool = pool || QUESTIONS;
    return pool.filter(function (q) {
      var s = stats[q.id];
      return s && ((s.wrong || 0) > 0 || s.lastWrong);
    });
  }

  function hardScore(q) {
    var s = stats[q.id] || { correct: 0, wrong: 0, lastWrong: false };
    var tries = (s.correct || 0) + (s.wrong || 0);
    var rate = tries ? (s.wrong || 0) / tries : 0;
    return (s.wrong || 0) * 3 + (s.lastWrong ? 5 : 0) + rate;
  }

  function hint(t) {
    byId("hint").textContent = t;
  }

  function startMode(mode) {
    resetSession();
    var all = QUESTIONS.slice();

    if (mode === "random20") {
      current = sample(all, 20);
      hint("Режим: 20 случайных вопросов.");
    }

    if (mode === "smart20") {
      var m = sample(mistakes(all), 14);
      var used = {};
      m.forEach(function (q) { used[q.id] = true; });
      var rest = all.filter(function (q) { return !used[q.id]; });
      current = shuffle(m.concat(sample(rest, 20 - m.length)));
      hint("Умный режим: ошибки + случайные вопросы.");
    }

    if (mode === "mistakes20") {
      var mm = mistakes(all);
      current = sample(mm, 20);
      hint(mm.length ? "Режим: вопросы из сохранённых ошибок." : "Ошибок пока нет.");
    }

    if (mode === "hardest20") {
      var h = mistakes(all).sort(function (a, b) { return hardScore(b) - hardScore(a); });
      current = h.slice(0, 20);
      hint(h.length ? "Режим: самые проблемные вопросы." : "Проблемных вопросов пока нет.");
    }

    if (mode === "all") {
      current = shuffle(all);
      hint("Режим: все вопросы из двух JSON.");
    }

    if (mode === "new87") {
      current = shuffle(newQuestions());
      hint("Режим: только 87 новых вопросов.");
    }

    if (mode === "old") {
      current = shuffle(oldQuestions());
      hint("Режим: только старые вопросы.");
    }

    render(current);
  }

  function render(list) {
    var root = byId("quiz");

    if (!QUESTIONS.length) {
      root.innerHTML = '<div class="empty">Вопросы не загрузились. Проверь, что файл открыт в браузере, а не в предпросмотре.</div>';
      updateStats();
      return;
    }

    if (!list.length) {
      root.innerHTML = '<div class="empty">Нет вопросов для этого режима.</div>';
      updateStats();
      return;
    }

    var parts = [];

    for (var i = 0; i < list.length; i++) {
      var q = list[i];
      var sourceLabel = q.source === "new" ? "NEW_QUESTIONS_CAMPUS" : "Предыдущий JSON";
      var searchText = (q.topic + " " + q.question + " " + Object.keys(q.options).map(function (k) { return q.options[k]; }).join(" ") + " " + q.correct_answer).toLowerCase();

      parts.push('<article class="card" id="card_' + safeId(q.id) + '" data-qid="' + esc(q.id) + '" data-text="' + esc(searchText) + '">');
      parts.push('<div class="meta"><span class="tag">#' + (i + 1) + '</span><span class="tag">' + esc(q.topic) + '</span><span class="tag source">' + esc(sourceLabel) + '</span><span class="tag">исх. № ' + esc(q.original_number) + '</span></div>');
      parts.push('<div class="q">' + esc(q.question) + '</div>');
      parts.push('<div class="options">');

      Object.keys(q.options).forEach(function (letter) {
        parts.push('<button class="opt" data-qid="' + esc(q.id) + '" data-letter="' + esc(letter) + '"><b>' + esc(letter) + ')</b> ' + esc(q.options[letter]) + '</button>');
      });

      parts.push('</div>');
      parts.push('<div class="answer" id="ans_' + safeId(q.id) + '">✅ Правильный ответ: <b>' + esc(q.correct_letter) + '</b> — ' + esc(q.correct_answer) + '</div>');
      parts.push('</article>');
    }

    root.innerHTML = parts.join("");
    updateStats();
    setTimeout(function () { window.scrollTo(0, 0); }, 0);
  }

  function answer(id, letter) {
    if (session.answeredIds[id]) return;

    var q = null;
    for (var i = 0; i < QUESTIONS.length; i++) {
      if (QUESTIONS[i].id === id) { q = QUESTIONS[i]; break; }
    }
    if (!q) return;

    var card = byId("card_" + safeId(id));
    if (!card) return;

    session.answeredIds[id] = true;
    card.classList.add("answered");

    var st = statFor(id);
    st.seen++;

    var ok = letter === q.correct_letter;
    session.answered++;

    if (ok) {
      session.correct++;
      st.correct++;
      st.lastWrong = false;
    } else {
      session.wrong++;
      session.wrongIds[id] = true;
      st.wrong++;
      st.lastWrong = true;
    }

    var btns = card.querySelectorAll(".opt");
    for (var b = 0; b < btns.length; b++) {
      var l = btns[b].getAttribute("data-letter");
      if (l === q.correct_letter) btns[b].classList.add("correct");
      if (l === letter && !ok) btns[b].classList.add("wrong");
    }

    var ans = byId("ans_" + safeId(id));
    if (ans) ans.classList.add("show");

    saveStats();
  }

  function retrySessionMistakes() {
    var list = current.filter(function (q) { return session.wrongIds[q.id]; });
    resetSession();
    current = shuffle(list);
    hint(list.length ? "Повтор ошибок текущей сессии." : "В этой сессии ошибок пока нет.");
    render(current);
  }

  function shuffleCurrent() {
    current = shuffle(current);
    render(current);
  }

  function applySearch() {
    var val = byId("search").value.toLowerCase().trim();
    var cards = document.querySelectorAll(".card");
    var shown = 0;

    for (var i = 0; i < cards.length; i++) {
      var ok = !val || (cards[i].getAttribute("data-text") || "").indexOf(val) !== -1;
      cards[i].style.display = ok ? "" : "none";
      if (ok) shown++;
    }

    byId("shownCount").textContent = shown;
  }

  function updateStats() {
    var saved = 0;
    for (var k in stats) {
      if (stats[k] && ((stats[k].wrong || 0) > 0 || stats[k].lastWrong)) saved++;
    }

    byId("totalCount").textContent = QUESTIONS.length;
    byId("shownCount").textContent = current.length;
    byId("answeredCount").textContent = session.answered;
    byId("correctCount").textContent = session.correct;
    byId("wrongCount").textContent = session.wrong;
    byId("savedMistakes").textContent = saved;

    var pct = current.length ? Math.round(session.answered / current.length * 100) : 0;
    byId("progress").style.width = pct + "%";
  }

  function resetStats() {
    if (!confirm("Сбросить статистику ошибок?")) return;
    stats = {};
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    resetSession();
    render(current);
  }

  function toggleTools() {
    byId("tools").classList.toggle("show");
  }

  function exportStats() {
    var box = byId("statsBox");
    box.style.display = "block";
    box.value = JSON.stringify(stats, null, 2);
  }

  function importStats() {
    var box = byId("statsBox");
    box.style.display = "block";
    if (!box.value.trim()) return;
    try {
      stats = JSON.parse(box.value);
      saveStats();
      alert("Импортировано");
    } catch (e) {
      alert("Неверный JSON");
    }
  }

  function scrollNext() {
    var cards = document.querySelectorAll(".card");
    for (var i = 0; i < cards.length; i++) {
      if (!cards[i].classList.contains("answered") && cards[i].style.display !== "none") {
        cards[i].scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
    }
  }

  function bindEvents() {
    document.querySelector(".modes").addEventListener("click", function (e) {
      var mode = e.target.getAttribute("data-mode");
      if (mode) startMode(mode);
    });

    byId("shuffleBtn").addEventListener("click", shuffleCurrent);
    byId("retrySessionBtn").addEventListener("click", retrySessionMistakes);
    byId("resetBtn").addEventListener("click", resetStats);
    byId("toolsBtn").addEventListener("click", toggleTools);
    byId("exportBtn").addEventListener("click", exportStats);
    byId("importBtn").addEventListener("click", importStats);
    byId("hideToolsBtn").addEventListener("click", toggleTools);
    byId("nextBtn").addEventListener("click", scrollNext);
    byId("topBtn").addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
    byId("search").addEventListener("input", applySearch);

    byId("quiz").addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest(".opt") : null;
      if (!btn) return;
      answer(btn.getAttribute("data-qid"), btn.getAttribute("data-letter"));
    });
  }

  function init() {
    loadQuestions();
    loadStats();
    bindEvents();
    byId("totalCount").textContent = QUESTIONS.length;
    if (QUESTIONS.length) startMode("random20");
    else render([]);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
